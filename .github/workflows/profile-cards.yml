name: Generate Profile Summary Cards

# Sem gatilho em push: a action commita os SVGs regenerados na própria main,
# então rodar a cada push deixaria o clone local atrás do remoto na hora,
# fazendo o próximo `git push` ser rejeitado. Schedule + manual bastam,
# já que as estatísticas do perfil mudam devagar.
on:
  schedule:
    - cron: "0 */12 * * *"   # roda a cada 12 horas automaticamente
  workflow_dispatch:           # permite rodar manualmente

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # Com o repo já checado em main, a action commita nesta mesma branch,
      # gerando os SVGs em profile-summary-card-output/<tema>/.
      # É de lá que o README lê os cards — não de uma branch separada.
      - name: Generate profile summary cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: profile-summary-card-output
